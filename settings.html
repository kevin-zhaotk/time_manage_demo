<body class="bg-black">

                    <div class="card">

                                </div>

                                    </div>
                                    <div>
                                        <p class="font-medium">字体大小</p>

                                </div>

                                </div>

                <!-- 其他设置 -->

                        <div class="space-y-4">

                            <!-- 意见反馈 -->

                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-indigo-100 rounded-lg flex items-center justify-center">
                                        <i class="fas fa-comment text-indigo-600"></i>
                                    </div>
                                    <div>
                                        <p class="font-medium">意见反馈</p>
                                        <p class="text-sm text-gray-500">帮助我们改进产品</p>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-right text-gray-400"></i>
                            </div>

                            <div class="border-t border-gray-100"></div>

                            <!-- 关于我们 -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-pink-100 rounded-lg flex items-center justify-center">
                                        <i class="fas fa-info-circle text-pink-600"></i>
                                    </div>
                                    <div>
                                        <p class="font-medium">关于我们</p>
                                        <p class="text-sm text-gray-500">版本 1.0.0</p>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-right text-gray-400"></i>
                            </div>

                            <div class="border-t border-gray-100"></div>

                            <!-- 隐私政策 -->
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-gray-100 rounded-lg flex items-center justify-center">
                                        <i class="fas fa-shield-alt text-gray-600"></i>
                                    </div>
                                    <div>
                                        <p class="font-medium">隐私政策</p>
                                        <p class="text-sm text-gray-500">了解数据使用方式</p>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-right text-gray-400"></i>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 版本信息 -->

                    <p class="text-xs mt-1">© 2024 All Rights Reserved</p>

            </div>

            <!-- 底部导航 -->
            <div class="bottom-nav">
                <a href="home.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>主页</span>
                </a>
                <a href="converter.html" class="nav-item">
                    <i class="fas fa-exchange-alt"></i>
                    <span>转换</span>

                <a href="history.html" class="nav-item">

                    <i class="fas fa-cog"></i>

                </a>

        </div>

    <script>
        // 切换按钮功能
        document.addEventListener('DOMContentLoaded', function() {
            const toggleButtons = document.querySelectorAll('button[class*="rounded-full relative"]');
            
            toggleButtons.forEach(button => {
                button.addEventListener('click', function() {
                    const isActive = this.classList.contains('bg-blue-500');
                    const toggle = this.querySelector('div');
                    
                    if (isActive) {
                        this.classList.remove('bg-blue-500');
                        this.classList.add('bg-gray-300');
                        toggle.classList.remove('right-0.5');
                        toggle.classList.add('left-0.5');
                    } else {
                        this.classList.remove('bg-gray-300');
                        this.classList.add('bg-blue-500');
                        toggle.classList.remove('left-0.5');
                        toggle.classList.add('right-0.5');
                    }
                });
            });

            // 页面加载动画
            const cards = document.querySelectorAll('.card, .card-large');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.classList.add('fade-in');
                }, index * 100);
            });
        });
    </script>
</body>
</html>
