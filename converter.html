<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日期转换</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black">
    <div class="phone-container">
        <div class="phone-screen">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="status-left">9:41</div>
                <div class="status-right">
                    <i class="fas fa-signal text-sm"></i>
                    <i class="fas fa-wifi text-sm"></i>
                    <i class="fas fa-battery-three-quarters text-sm"></i>
                </div>
            </div>

            <!-- 主内容 -->
            <div class="main-content">
                <!-- 标题栏 -->
                <div class="flex items-center justify-between pt-6 pb-4">
                    <a href="home.html" class="w-10 h-10 flex items-center justify-center rounded-full bg-gray-100">
                        <i class="fas fa-arrow-left text-gray-600"></i>
                    </a>
                    <h1 class="title-medium">日期转换</h1>
                    <div class="w-10"></div>
                </div>

                <!-- 转换模式切换 -->
                <div class="card mb-6">
                    <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
                        <button id="solarBtn" class="flex-1 py-3 px-4 rounded-md font-medium transition-all duration-200 bg-white text-blue-600 shadow-sm">
                            <i class="fas fa-calendar-alt mr-2"></i>
                            公历转农历
                        </button>
                        <button id="lunarBtn" class="flex-1 py-3 px-4 rounded-md font-medium transition-all duration-200 text-gray-600">
                            <i class="fas fa-moon mr-2"></i>
                            农历转公历
                        </button>
                    </div>

                    <!-- 公历转农历模式 -->
                    <div id="solarMode" class="conversion-mode">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">选择公历日期</label>
                            <div class="flex space-x-2">
                                <select class="flex-1 p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option>2024年</option>
                                    <option>2023年</option>
                                    <option>2025年</option>
                                </select>
                                <select class="flex-1 p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option>1月</option>
                                    <option>2月</option>
                                    <option>3月</option>
                                    <option>4月</option>
                                    <option>5月</option>
                                    <option>6月</option>
                                    <option>7月</option>
                                    <option>8月</option>
                                    <option>9月</option>
                                    <option>10月</option>
                                    <option>11月</option>
                                    <option>12月</option>
                                </select>
                                <select class="flex-1 p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option>15日</option>
                                    <option>1日</option>
                                    <option>2日</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- 农历转公历模式 -->
                    <div id="lunarMode" class="conversion-mode hidden">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700 mb-2">选择农历日期</label>
                            <div class="flex space-x-2 mb-3">
                                <select class="flex-1 p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option>甲辰龙年</option>
                                    <option>癸卯兔年</option>
                                    <option>乙巳蛇年</option>
                                </select>
                                <select class="flex-1 p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                    <option>腊月</option>
                                    <option>正月</option>
                                    <option>二月</option>
                                    <option>三月</option>
                                    <option>四月</option>
                                    <option>五月</option>
                                    <option>六月</option>
                                    <option>七月</option>
                                    <option>八月</option>
                                    <option>九月</option>
                                    <option>十月</option>
                                    <option>冬月</option>
                                </select>
                            </div>
                            <select class="w-full p-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                                <option>初五</option>
                                <option>初一</option>
                                <option>初二</option>
                                <option>初三</option>
                                <option>初四</option>
                                <option>初六</option>
                                <option>初七</option>
                                <option>初八</option>
                                <option>初九</option>
                                <option>初十</option>
                                <option>十一</option>
                                <option>十二</option>
                                <option>十三</option>
                                <option>十四</option>
                                <option>十五</option>
                            </select>
                        </div>
                    </div>

                    <button class="btn-primary w-full">
                        <i class="fas fa-sync-alt mr-2"></i>
                        开始转换
                    </button>
                </div>

                <!-- 转换结果 -->
                <div class="card mb-6">
                    <div class="flex items-center justify-between mb-4">
                        <h3 class="title-medium">转换结果</h3>
                        <i class="fas fa-check-circle text-green-500"></i>
                    </div>
                    
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 mb-4">
                        <div class="text-center">
                            <h4 class="text-lg font-semibold text-blue-900 mb-2">公历日期</h4>
                            <p class="text-2xl font-bold text-blue-600">2024年1月15日</p>
                            <p class="text-blue-500 text-sm mt-1">星期一</p>
                        </div>
                    </div>

                    <div class="flex items-center justify-center mb-4">
                        <div class="w-8 h-8 bg-gray-200 rounded-full flex items-center justify-center">
                            <i class="fas fa-arrow-down text-gray-500"></i>
                        </div>
                    </div>

                    <div class="bg-purple-50 border border-purple-100 rounded-lg p-4">
                        <div class="text-center">
                            <h4 class="text-lg font-semibold text-purple-900 mb-2">农历日期</h4>
                            <p class="text-2xl font-bold text-purple-600">腊月初五</p>
                            <p class="text-purple-500 text-sm mt-1">甲辰龙年</p>
                        </div>
                    </div>

                    <!-- 详细信息 -->
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div>
                                <span class="text-gray-500">节气：</span>
                                <span class="font-medium">小寒</span>
                            </div>
                            <div>
                                <span class="text-gray-500">星宿：</span>
                                <span class="font-medium">角木蛟</span>
                            </div>
                            <div>
                                <span class="text-gray-500">五行：</span>
                                <span class="font-medium">木</span>
                            </div>
                            <div>
                                <span class="text-gray-500">冲煞：</span>
                                <span class="font-medium">冲鸡</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 快捷操作 -->
                <div class="grid grid-cols-2 gap-3 mb-6">
                    <button class="card text-center hover:bg-gray-50 transition-colors">
                        <i class="fas fa-bookmark text-blue-500 text-xl mb-2"></i>
                        <p class="text-sm font-medium">收藏</p>
                    </button>
                    <button class="card text-center hover:bg-gray-50 transition-colors">
                        <i class="fas fa-share text-green-500 text-xl mb-2"></i>
                        <p class="text-sm font-medium">分享</p>
                    </button>
                </div>
            </div>

            <!-- 底部导航 -->
            <div class="bottom-nav">
                <a href="home.html" class="nav-item">
                    <i class="fas fa-home"></i>
                    <span>主页</span>
                </a>
                <a href="converter.html" class="nav-item active">
                    <i class="fas fa-exchange-alt"></i>
                    <span>转换</span>
                </a>
                <a href="history.html" class="nav-item">
                    <i class="fas fa-history"></i>
                    <span>记录</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>设置</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 模式切换功能
        const solarBtn = document.getElementById('solarBtn');
        const lunarBtn = document.getElementById('lunarBtn');
        const solarMode = document.getElementById('solarMode');
        const lunarMode = document.getElementById('lunarMode');

        solarBtn.addEventListener('click', function() {
            solarBtn.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
            solarBtn.classList.remove('text-gray-600');
            lunarBtn.classList.add('text-gray-600');
            lunarBtn.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
            
            solarMode.classList.remove('hidden');
            lunarMode.classList.add('hidden');
        });

        lunarBtn.addEventListener('click', function() {
            lunarBtn.classList.add('bg-white', 'text-blue-600', 'shadow-sm');
            lunarBtn.classList.remove('text-gray-600');
            solarBtn.classList.add('text-gray-600');
            solarBtn.classList.remove('bg-white', 'text-blue-600', 'shadow-sm');
            
            lunarMode.classList.remove('hidden');
            solarMode.classList.add('hidden');
        });

        // 页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.card');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.classList.add('fade-in');
                }, index * 100);
            });
        });
    </script>
</body>
</html>
