<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日历转换 - 主页</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'sf': ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-black">
    <div class="phone-container">
        <div class="phone-screen">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="status-left">9:41</div>
                <div class="status-right">
                    <i class="fas fa-signal text-sm"></i>
                    <i class="fas fa-wifi text-sm"></i>
                    <i class="fas fa-battery-three-quarters text-sm"></i>
                </div>
            </div>

            <!-- 主内容 -->
            <div class="main-content">
                <!-- 问候语 -->
                <div class="pt-6 pb-4">
                    <h1 class="title-large text-gray-900">今天</h1>
                    <p class="caption-text mt-1">2024年1月15日 星期一</p>
                </div>

                <!-- 今日日期卡片 -->
                <div class="card-large lunar-gradient text-white mb-6 fade-in">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <h2 class="text-2xl font-bold mb-1">2024年1月15日</h2>
                            <p class="text-white/80 text-lg">公历 · 星期一</p>
                        </div>
                        <div class="text-right">
                            <i class="fas fa-sun text-3xl text-yellow-300 mb-2"></i>
                        </div>
                    </div>
                    
                    <div class="border-t border-white/20 pt-4">
                        <div class="flex justify-between items-center">
                            <div>
                                <h3 class="text-xl font-semibold">腊月初五</h3>
                                <p class="text-white/80">农历甲辰龙年</p>
                            </div>
                            <div class="text-right">
                                <p class="text-sm text-white/80">小寒</p>
                                <p class="text-xs text-white/60">已过 6 天</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 快速功能 -->
                <div class="mb-6">
                    <h3 class="title-medium mb-4">快速转换</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <a href="converter.html" class="card text-center hover:scale-105 transition-transform duration-200">
                            <i class="fas fa-exchange-alt text-3xl text-blue-500 mb-3"></i>
                            <h4 class="font-semibold mb-1">日期转换</h4>
                            <p class="caption-text">公历农历互转</p>
                        </a>
                        <a href="history.html" class="card text-center hover:scale-105 transition-transform duration-200">
                            <i class="fas fa-history text-3xl text-green-500 mb-3"></i>
                            <h4 class="font-semibold mb-1">查询记录</h4>
                            <p class="caption-text">历史查询</p>
                        </a>
                    </div>
                </div>

                <!-- 节气信息 -->
                <div class="card mb-6">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="title-medium">节气日历</h3>
                        <i class="fas fa-leaf text-green-500"></i>
                    </div>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center py-2 border-b border-gray-100 last:border-b-0">
                            <div>
                                <p class="font-medium">大寒</p>
                                <p class="caption-text">1月20日</p>
                            </div>
                            <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded-full">5天后</span>
                        </div>
                        <div class="flex justify-between items-center py-2 border-b border-gray-100 last:border-b-0">
                            <div>
                                <p class="font-medium">立春</p>
                                <p class="caption-text">2月4日</p>
                            </div>
                            <span class="text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded-full">20天后</span>
                        </div>
                        <div class="flex justify-between items-center py-2">
                            <div>
                                <p class="font-medium">雨水</p>
                                <p class="caption-text">2月19日</p>
                            </div>
                            <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full">35天后</span>
                        </div>
                    </div>
                </div>

                <!-- 传统节日 -->
                <div class="card mb-6">
                    <div class="flex items-center justify-between mb-3">
                        <h3 class="title-medium">传统节日</h3>
                        <i class="fas fa-gift text-red-500"></i>
                    </div>
                    <div class="bg-red-50 border border-red-100 rounded-lg p-4">
                        <div class="flex items-center justify-between">
                            <div>
                                <h4 class="font-semibold text-red-800">春节</h4>
                                <p class="text-red-600 text-sm">农历正月初一</p>
                                <p class="caption-text text-red-500">2024年2月10日</p>
                            </div>
                            <div class="text-right">
                                <span class="text-2xl font-bold text-red-600">26</span>
                                <p class="text-xs text-red-500">天后</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 底部导航 -->
            <div class="bottom-nav">
                <a href="home.html" class="nav-item active">
                    <i class="fas fa-home"></i>
                    <span>主页</span>
                </a>
                <a href="converter.html" class="nav-item">
                    <i class="fas fa-exchange-alt"></i>
                    <span>转换</span>
                </a>
                <a href="history.html" class="nav-item">
                    <i class="fas fa-history"></i>
                    <span>记录</span>
                </a>
                <a href="settings.html" class="nav-item">
                    <i class="fas fa-cog"></i>
                    <span>设置</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 添加页面加载动画
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.card, .card-large');
            cards.forEach((card, index) => {
                setTimeout(() => {
                    card.classList.add('fade-in');
                }, index * 100);
            });
        });
    </script>
</body>
</html>
